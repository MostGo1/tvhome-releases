name: Publish
on:
  push:
    branches: [main]
    paths: [app-debug.apk, build.txt]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(cat build.txt)
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app-debug.apk --title "TV Home" --notes "build $B" --latest
